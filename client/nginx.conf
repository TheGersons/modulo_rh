server {
    listen 80;

    # App retirada: toda petición muestra la página de migración.
    # La página redirige automáticamente a la nueva URL a los 5 segundos.
    root /usr/share/nginx/html;

    # Nunca cachear la página de migración (para poder cambiar la URL nueva sin caché vieja)
    location = /migracion.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Todo lo demás (incluido /api/) sirve la página de migración con 200.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /migracion.html =404;
    }
}
