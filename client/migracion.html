<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplicación migrada — Sistema de KPIs</title>
  <style>
    :root {
      --ground: #f6f7f9;
      --surface: #ffffff;
      --ink: #16202e;
      --muted: #5a6473;
      --hairline: #e4e8ee;
      --accent: #1b4f9c;
      --accent-strong: #163f7d;
      --track: #ebeef3;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: var(--ground);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 44px 40px 36px;
      box-shadow: 0 1px 2px rgba(22, 32, 46, 0.04),
                  0 12px 32px rgba(22, 32, 46, 0.08);
      overflow: hidden;
    }

    /* Fina regla de acento superior */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-wrap: balance;
      color: var(--ink);
    }

    p {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--muted);
    }

    .destino {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 26px 0 4px;
      padding: 16px 18px;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--ground);
    }

    .destino-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .destino a {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .destino a:hover { text-decoration: underline; }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 22px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .cta:hover { background: var(--accent-strong); }

    .cta:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .progress {
      margin-top: 28px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .progress-meta strong {
      color: var(--ink);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 5px;
      width: 100%;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 999px;
    }

    .bar.run {
      width: 100%;
      transition: width 5s linear;
    }

    @media (prefers-reduced-motion: reduce) {
      .bar.run { transition: none; width: 100%; }
    }

    @media (max-width: 420px) {
      .card { padding: 36px 24px 30px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Sistema de KPIs</p>
    <h1>La aplicación se ha migrado a una nueva dirección</h1>
    <p>Esta versión ha sido descontinuada. La plataforma de KPIs ahora opera desde una nueva ubicación.</p>
    <p>Te recomendamos actualizar tus marcadores.</p>

    <div class="destino">
      <span class="destino-label">Nueva dirección</span>
      <a id="destino-url" href="#">Cargando…</a>
    </div>

    <a class="cta" id="cta" href="#">Ir a la nueva aplicación</a>

    <div class="progress">
      <div class="progress-meta">
        <span>Redirección automática</span>
        <strong><span id="contador">5</span> s</strong>
      </div>
      <div class="track">
        <div class="bar" id="bar"></div>
      </div>
    </div>
  </main>

  <script>
    /* ─────────────────────────────────────────────────────────────
       EDITA AQUÍ la URL nueva de la aplicación migrada
    ───────────────────────────────────────────────────────────── */
    var NUEVA_URL = "http://CAMBIAME:8080";
    var SEGUNDOS  = 5;
    /* ───────────────────────────────────────────────────────────── */

    var urlEl     = document.getElementById("destino-url");
    var ctaEl     = document.getElementById("cta");
    var contador  = document.getElementById("contador");
    var bar       = document.getElementById("bar");

    urlEl.href = NUEVA_URL;
    urlEl.textContent = NUEVA_URL;
    ctaEl.href = NUEVA_URL;

    // Lanza la animación de la barra en el siguiente frame
    requestAnimationFrame(function () { bar.classList.add("run"); });

    var restante = SEGUNDOS;
    var intervalo = setInterval(function () {
      restante -= 1;
      contador.textContent = restante < 0 ? 0 : restante;
      if (restante <= 0) {
        clearInterval(intervalo);
        window.location.replace(NUEVA_URL);
      }
    }, 1000);
  </script>
</body>
</html>
